name: Deploy Next.js App - Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create env file
        run: |
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-prod-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-prod-${{ hashFiles('**/package-lock.json') }}-

      - name: Build project
        run: npm run build

      # =========================
      # SETUP SSH
      # =========================
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh

          # Write private key — preserve exact formatting
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Add server to known_hosts to avoid host verification prompt
          ssh-keyscan -p 9389 -H 65.20.74.159 >> ~/.ssh/known_hosts 2>/dev/null

          # Write SSH config for convenience
          cat > ~/.ssh/config << EOF
          Host deploy-server
            HostName 65.20.74.159
            User ${{ secrets.SSH_USER }}
            Port 9389
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ConnectTimeout 30
            ServerAliveInterval 60
            ServerAliveCountMax 10
          EOF

          chmod 600 ~/.ssh/config

      # =========================
      # DEBUG NETWORK
      # =========================
      - name: Debug connectivity
        run: |
          echo "=== Runner IP ==="
          curl -s https://api.ipify.org

          echo ""
          echo "=== Port check ==="
          nc -zv -w 15 65.20.74.159 9389

          echo ""
          echo "=== SSH banner ==="
          timeout 10 bash -c "echo '' | nc 65.20.74.159 9389" || true

          echo ""
          echo "=== Test SSH connection ==="
          ssh -i ~/.ssh/id_rsa \
              -p 9389 \
              -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              ${{ secrets.SSH_USER }}@65.20.74.159 \
              "echo 'SSH handshake OK'" || echo "SSH test failed"

      # =========================
      # RSYNC DEPLOY
      # =========================
      - name: Upload project files via rsync
        run: |
          rsync -avz \
            --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next/cache' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_rsa -p 9389 -o ConnectTimeout=30 -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.SSH_USER }}@65.20.74.159:~/morz/

      # =========================
      # REMOTE DEPLOY
      # =========================
      - name: Deploy and run with PM2
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -p 9389 \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            ${{ secrets.SSH_USER }}@65.20.74.159 << 'ENDSSH'

            set -e

            cd ~/morz

            echo "=== Creating .env ==="
            cat > .env << EOL
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EOL

            echo "=== Stopping existing PM2 process ==="
            pm2 delete morz || true

            echo "=== Freeing port 3015 if occupied ==="
            PORT=3015
            PID=$(lsof -t -i:$PORT 2>/dev/null || true)
            if [ -n "$PID" ]; then
              kill -9 $PID || true
              echo "Killed PID $PID on port $PORT"
            fi

            echo "=== Installing dependencies ==="
            npm ci --omit=dev

            echo "=== Installing sharp ==="
            npm install sharp

            echo "=== Starting app with PM2 ==="
            PORT=3015 pm2 start npm --name morz -- start

            pm2 save

            echo "=== Waiting for startup ==="
            sleep 10

            pm2 status

            pm2 logs morz --lines 20 --nostream || true

            echo "=== Deployment complete ==="

          ENDSSH