name: Deploy Next.js App - Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create env file
        run: |
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-prod-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-prod-${{ hashFiles('**/package-lock.json') }}-

      - name: Build project
        run: npm run build

      # =========================
      # DEBUG NETWORK
      # =========================
      - name: Debug connectivity
        run: |
          echo "Testing port 9389..."
          nc -zv 65.20.74.159 9389
          curl -s https://api.ipify.org

      # =========================
      # SETUP SSH
      # =========================
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p 9389 65.20.74.159 >> ~/.ssh/known_hosts

      # =========================
      # DEBUG SSH
      # =========================
      - name: Debug SSH connection
        run: |
          ssh -vvv \
            -i ~/.ssh/id_rsa \
            -p 9389 \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo 'SSH connection successful'"

      # =========================
      # RSYNC DEPLOY
      # =========================
      - name: Upload project files via rsync
        run: |
          rsync -avz \
            --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next/cache' \
            -e "ssh -i ~/.ssh/id_rsa -p 9389 -o ConnectTimeout=30 -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/morz/

      # =========================
      # REMOTE DEPLOY
      # =========================
      - name: Deploy and run with PM2
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -p 9389 \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

            set -e

            cd ~/morz

            echo "Creating env..."

            cat > .env << EOL
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            EOL

            echo "Stopping existing PM2 app..."

            pm2 delete morz || true

            echo "Killing port 3015 if occupied..."

            PORT=3015
            PID=$(lsof -t -i:$PORT || true)

            if [ ! -z "$PID" ]; then
              kill -9 $PID || true
            fi

            echo "Installing dependencies..."

            npm ci --omit=dev

            echo "Installing sharp..."

            npm install sharp

            echo "Starting app..."

            PORT=3015 pm2 start npm --name morz -- start

            pm2 save

            echo "Waiting for app startup..."

            sleep 10

            pm2 status

            pm2 logs morz --lines 20 --nostream || true

            echo "Deployment completed."

          EOF