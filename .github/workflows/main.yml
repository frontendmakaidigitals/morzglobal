name: Deploy Next.js App - Production

on:
  push:
    branches:
      - main


jobs:
  build-and-deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create env file
        run: |
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env

      - name: Cache Next.js build
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-prod-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-prod-${{ hashFiles('**/package-lock.json') }}-

      - name: Build project
        run: npm run build
      - name: Debug connectivity
        run: |
            nc -zv 65.20.74.159 9389
            nc -zv 65.20.74.159 22

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Upload project files via rsync
        run: |
          rsync -avz --delete --exclude '.git' --exclude 'node_modules' \
            -e "ssh -p 9389 -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/morz/

      - name: Deploy and run with PM2
        run: |
          ssh -i ~/.ssh/id_rsa -p 9389 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ~/morz &&
            
            # Create environment file
            echo 'RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}' > .env
            
            # Stop and delete existing PM2 process if it exists
            pm2 delete morz || true
            
            # Check if port 3015 is in use and kill the process
            PORT=3015
            PID=\$(lsof -t -i:\$PORT) || true
            [ ! -z \"\$PID\" ] && kill -9 \$PID || true
            
            # Install dependencies
            npm ci --omit=dev &&
            npm i sharp &&
            
            # Start the application with PM2
            PORT=3015 pm2 start npm --name morz -- start
            
            # Enable timestamp logging and save the PM2 process
            pm2 save
            pm2 set pm2:logs:timestamp true
            
            # Verify app is running
            sleep 5
            pm2 list | grep -q 'morz.*online' && echo 'App started successfully' || (pm2 logs morz --lines 50 && exit 1)
          "
